name: Terraform Plan

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "workspace=prod" >> "${GITHUB_OUTPUT}"
            echo "environment=production" >> "${GITHUB_OUTPUT}"
          else
            echo "workspace=staging" >> "${GITHUB_OUTPUT}"
            echo "environment=staging" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Write backend config
        shell: bash
        run: |
          cat > infra/live/backend.hcl <<EOF
          bucket         = "${{ secrets.TF_STATE_BUCKET }}"
          key            = "healthapp/live/terraform.tfstate"
          region         = "${{ vars.AWS_REGION }}"
          dynamodb_table = "${{ secrets.TF_LOCK_TABLE }}"
          encrypt        = true
          EOF

      - name: Terraform init
        run: terraform -chdir=infra/live init -backend-config=backend.hcl

      - name: Select workspace
        shell: bash
        run: |
          terraform -chdir=infra/live workspace select "${{ steps.target.outputs.workspace }}" \
            || terraform -chdir=infra/live workspace new "${{ steps.target.outputs.workspace }}"

      - name: Terraform plan
        shell: bash
        run: |
          INSTANCE_TYPE="${{ vars.INSTANCE_TYPE }}"
          if [[ -z "${INSTANCE_TYPE}" ]]; then
            INSTANCE_TYPE="t3.large"
          fi

          terraform -chdir=infra/live plan \
            -out=tfplan \
            -input=false \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="aws_region=${{ vars.APP_CORS_ALLOWED_ORIGINS }}" \
            -var="root_domain=${{ vars.ROOT_DOMAIN }}" \
            -var="hosted_zone_id=${{ vars.HOSTED_ZONE_ID }}" \
            -var="instance_type=${INSTANCE_TYPE}" \
            -var="app_image_tag=plan-${{ github.sha }}" \
            -var="staging_frontend_origin=${{ vars.STAGING_FRONTEND_ORIGIN }}" \
            -var="prod_frontend_origin=${{ vars.PROD_FRONTEND_ORIGIN }}"

      - name: Export plan
        run: terraform -chdir=infra/live show -no-color tfplan > infra/live/plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ steps.target.outputs.workspace }}
          path: infra/live/plan.txt
