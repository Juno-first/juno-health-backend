services:
  postgres:
    image: postgres:17
    container_name: healthapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthapp
      POSTGRES_USER: healthapp
      POSTGRES_PASSWORD: healthapp_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - healthapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthapp -d healthapp"]
      interval: 10s
      timeout: 50s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: healthapp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@healthapp.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - healthapp_network
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: healthapp_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - healthapp_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev", "ping"]
      interval: 10s
      timeout: 50s
      retries: 5

  # ─────────────────────────────────────────────
  # Kafka (KRaft — no Zookeeper needed)
  # Two listeners:
  #   PLAINTEXT://kafka:29092  — internal (Confluent services)
  #   PLAINTEXT_HOST://localhost:9092 — external (host machine)
  # ─────────────────────────────────────────────

  kafka:
    image: apache/kafka:4.1.0
    container_name: healthapp_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - healthapp_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 100s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ─────────────────────────────────────────────
  # Kafka topic init
  # CHANGED: runs as a separate one-shot container using apache/kafka binaries
  # ─────────────────────────────────────────────

  kafka-setup:
    image: apache/kafka:4.1.0
    container_name: healthapp_kafka_setup
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - healthapp_network
    entrypoint: ["bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-configs.sh \
          --alter \
          --bootstrap-server kafka:29092 \
          --entity-type topics \
          --entity-name client_portfolio \
          --add-config cleanup.policy=compact,retention.ms=-1 || \
          echo 'Topic not yet created — compaction will need to be applied after ksqlDB creates it.'

  # ─────────────────────────────────────────────
  # Confluent platform services
  # ─────────────────────────────────────────────

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.7
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    networks:
      - healthapp_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.7.7
    depends_on:
      clickhouse:
        condition: service_started
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "connect-cluster"
      CONNECT_CONFIG_STORAGE_TOPIC: "connect-configs"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: "connect-offsets"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: "connect-status"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_LOGGERS: "org.reflections=ERROR"
      # Fast processing settings
      CONNECT_OFFSET_COMMIT_INTERVAL_MS: 100
      CONNECT_OFFSET_COMMIT_TIMEOUT_MS: 5000
      CONNECT_TASK_SHUTDOWN_GRACEFUL_TIMEOUT_MS: 10000
      CONNECT_STARTUP_TIMEOUT_MS: 60000
    volumes:
      - ./plugins:/usr/share/confluent-hub-components
      - ./connectors:/etc/kafka-connect/connectors
    networks:
      - healthapp_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    entrypoint: ["bash", "-c"]
    command:
      - |
        /etc/confluent/docker/run &

        until curl -fsS http://localhost:8083/connectors >/dev/null 2>&1; do
          echo "Waiting for Kafka Connect REST API..."
          sleep 2
        done
        echo "Kafka Connect is ready."

        echo "Registering connectors..."
        for f in /etc/kafka-connect/connectors/*.json; do
          curl -X POST -H 'Content-Type: application/json' --data @"$$f" http://localhost:8083/connectors || true
        done
        wait

  ksqldb-server:
    image: confluentinc/cp-ksqldb-server:7.7.7
    depends_on:
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_started
    ports:
      - "8088:8088"
    environment:
      KSQL_CONFIG_DIR: "/etc/ksql"
      KSQL_BOOTSTRAP_SERVERS: "kafka:29092"
      KSQL_LISTENERS: "http://0.0.0.0:8088"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 1
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
      KSQL_KSQL_SERVICE_ID: "client-ksqldb"
      KSQL_KSQL_CONNECT_URL: "http://kafka-connect:8083"
      KSQL_KSQL_EXTENSION_DIR: "/opt/ksql/ext"
      KSQL_KSQL_QUERIES_FILE: "/opt/ksql/ext/init-streams.sql"
    volumes:
      - ./ksql:/opt/ksql/ext
    networks:
      - healthapp_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    entrypoint: ["bash", "-c"]
    command:
      - |
        /etc/confluent/docker/run &

        echo "Waiting for ksqlDB to be reachable..."
        until curl -s http://localhost:8088/info >/dev/null 2>&1; do sleep 2; done

        echo "Running initialization script..."
        ksql http://localhost:8088 -f /opt/ksql/ext/init-streams.sql

        wait

  ksqldb-cli:
    image: confluentinc/cp-ksqldb-cli:7.7.7
    depends_on:
      - ksqldb-server
    entrypoint: /bin/sh
    tty: true
    networks:
      - healthapp_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: healthapp_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9021:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: healthapp
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: kafka-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      KAFKA_CLUSTERS_0_KSQLDBSERVER: http://ksqldb-server:8088
    networks:
      - healthapp_network
  
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    hostname: clickhouse
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config:/docker-entrypoint-initdb.d
    environment:
      CLICKHOUSE_DB: healthcare_queue
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - healthapp_network

  app:
    image: ${APP_IMAGE:-healthapp:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthapp_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-healthapp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-healthapp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-healthapp_dev}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: ${APP_JWT_SECRET:-your-super-secret-key-that-is-at-least-32-characters-long}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
    ports:
      - "8080:8080"
    networks:
      - healthapp_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 100s
      retries: 10
      start_period: 100s

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  kafka_data:
  clickhouse_data:

networks:
  healthapp_network:
    driver: bridge
